<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="/kaizenlogo.png" />
    <link rel="apple-touch-icon" href="/kaizenlogo.png" />
    <link rel="canonical" href="https://www.kaizenartandcraft.in/" />

    <title>
      Kaizen Livings | Premium Wooden Furniture & Home Decor
    </title>

    <meta
      name="description"
      content="Kaizen Livings offers premium handcrafted solid wood furniture and elegant home decor in India. Discover Sheesham & Teak sofas, dining sets, beds, and storage crafted in Jodhpur."

    <meta name="author" content="Kaizen Livings" />

    <link
      rel="preload"

      href="/images/banners/hero-sofa.jpg"
      fetchpriority="high"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Kaizen Livings | Premium Wooden Furniture & Home Decor"
    />

      property="og:description"
      content="Explore premium handcrafted solid wood furniture and modern home decor. Quality Jodhpur craftsmanship meets elegant design at Kaizen Livings."

    <meta property="og:site_name" content="Kaizen Livings" />
    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:image"
      content="https://www.kaizenartandcraft.in/kaizenlogo.png"
    />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Kaizen Livings | Premium Wooden Furniture"
    />

      name="twitter:description"
      content="Shop handcrafted solid wood furniture and elegant decor at Kaizen Livings."
    />

      name="twitter:image"
      content="https://www.kaizenartandcraft.in/kaizenlogo.png"
    />
